get:
  summary: List all items
  tags:
    - Item
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Item.yaml
post:
  summary: Create a new item
  tags:
    - Item
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/Item.yaml
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Item.yaml
    '400':
      description: Invalid Input
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ItemValidationError.yaml
/{itemId}:
  get:
    summary: Get an item by ID
    tags:
      - Item
    parameters:
      - name: itemId
        in: path
        required: true
        description: ID of the item to retrieve
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Item.yaml
      '404':
        $ref: ../components/responses/NotFoundError.yaml

  put:
    summary: Replace an existing item
    tags:
      - Item
    parameters:
      - name: itemId
        in: path
        required: true
        description: ID of the item to replace
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Item.yaml
    responses:
      '200':
        description: Item replaced
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Item.yaml
      '400':
        $ref: ../components/responses/ItemBadRequest.yaml
      '404':
        $ref: ../components/responses/NotFoundError.yaml

  delete:
    summary: Delete an item
    tags:
      - Item
    parameters:
      - name: itemId
        in: path
        required: true
        description: ID of the item to delete
        schema:
          type: integer
          example: 1
    responses:
      '204':
        description: Item deleted successfully
      '404':
        $ref: ../components/responses/NotFoundError.yaml
