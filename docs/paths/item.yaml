get:
  summary: List all items
  tags:
    - Item
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Item.yaml
post:
  summary: Create a new item
  tags:
    - Item
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/Item.yaml
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Item.yaml
    '400':
      description: Invalid Input
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ItemValidationError.yaml
