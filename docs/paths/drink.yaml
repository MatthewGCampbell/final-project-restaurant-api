get:
  summary: List all drinks
  tags:
    - Drink
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Drink.yaml

post:
  summary: Create a new drink
  tags:
    - Drink
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/Drink.yaml
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Drink.yaml
    "400":
      $ref: ../components/responses/DrinkBadRequest.yaml