get:
  summary: List all combos
  tags:
    - Combo
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Combo.yaml
post:
  summary: Create a new combo
  tags:
    - Combo
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/Combo.yaml
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Combo.yaml
    '400':
      description: Invalid Input
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ComboValidationError.yaml
/{comboId}:
  get:
    summary: Get a combo by ID
    tags:
      - Combo
    parameters:
      - name: comboId
        in: path
        required: true
        description: ID of the combo to retrieve
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Combo.yaml
      '404':
        $ref: ../components/responses/NotFoundError.yaml

  put:
    summary: Replace an existing combo
    tags:
      - Combo
    parameters:
      - name: comboId
        in: path
        required: true
        description: ID of the combo to replace
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Combo.yaml
    responses:
      '200':
        description: Combo replaced
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Combo.yaml
      '400':
        $ref: ../components/responses/ComboBadRequest.yaml
      '404':
        $ref: ../components/responses/NotFoundError.yaml

  delete:
    summary: Delete a combo
    tags:
      - Combo
    parameters:
      - name: comboId
        in: path
        required: true
        description: ID of the combo to delete
        schema:
          type: integer
          example: 1
    responses:
      '204':
        description: Combo deleted successfully
      '404':
        $ref: ../components/responses/NotFoundError.yaml
